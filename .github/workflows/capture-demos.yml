name: Capture actual portfolio demos (temporary)

on:
  push:
    branches: [design/asina-profile-readme]
    paths:
      - '.github/workflows/capture-demos.yml'

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/asina-profile-readme
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser automation
        run: |
          mkdir -p /tmp/readme-capture
          cd /tmp/readme-capture
          npm init -y >/dev/null
          npm install --no-audit --no-fund --silent playwright@1.57.0
          command -v google-chrome || command -v google-chrome-stable || command -v chromium
      - name: Capture live case demo UIs
        env:
          SITE_ORIGIN: https://spv-asina.github.io/asina
        run: |
          mkdir -p assets/real-demo-shots
          cat >/tmp/readme-capture/capture.cjs <<'JS'
          const fs=require('fs');
          const { chromium }=require('/tmp/readme-capture/node_modules/playwright');
          const codes=['mgd','shp','fpl','mfe','me'];
          async function snapshot(page,code,device){
            const url=process.env.SITE_ORIGIN+'/case-'+code+'.html';
            const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:45000});
            if(!response||response.status()>=400) throw new Error(code+' '+device+' HTTP '+(response&&response.status()));
            const root=page.locator('[data-demo-root]');
            await root.waitFor({state:'visible',timeout:30000});
            // The screenshot must contain the initialized live product demo, never the placeholder.
            await page.waitForFunction(()=>{const el=document.querySelector('[data-demo-root]');return !!el && !/Подготавливаем демонстрацию продукта/.test(el.innerText) && el.innerText.trim().length>120;},{timeout:30000});
            await root.scrollIntoViewIfNeeded();
            await page.waitForTimeout(250);
            const actions={mgd:'Собрать конспект',shp:'Извлечь и проверить',fpl:'Создать заказ',mfe:'Пересчитать прогноз',me:'Рассчитать смету'};
            const btn=root.getByRole('button',{name:actions[code],exact:true});
            await btn.waitFor({state:'visible',timeout:10000});
            await btn.click();
            await page.waitForTimeout(700);
            const text=(await root.innerText()).trim();
            if(text.length<120) throw new Error(code+' '+device+' demo still not rendered: '+text.slice(0,150));
            await root.screenshot({path:'assets/real-demo-shots/'+code+'-'+device+'.png',animations:'disabled',timeout:30000});
            fs.writeFileSync('assets/real-demo-shots/'+code+'-'+device+'.txt',text.slice(0,5000));
            console.log(code,device,'chars=',text.length,'screenshot OK; source:',url);
          }
          (async()=>{
            const fsSys=require('fs');const exe=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium'].find(p=>fsSys.existsSync(p)); if(!exe) throw new Error('No system Chrome found on runner'); const browser=await chromium.launch({headless:true,executablePath:exe,args:['--no-sandbox']});
            for(const code of codes){
              for(const device of ['desktop','mobile']){
                const page=await browser.newPage({viewport:device==='mobile'?{width:390,height:844}:{width:1400,height:970},deviceScaleFactor:1,locale:'ru-RU',colorScheme:'light'});
                try{ await snapshot(page,code,device); }
                finally{await page.close();}
              }
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/readme-capture/capture.cjs
      - name: Create editorial headers from captured real UI (no mock data)
        run: |
          python3 -m pip install --quiet --user pillow
          cat >/tmp/readme-capture/header.py <<'PY'
          from PIL import Image,ImageDraw,ImageFont,ImageFilter
          from pathlib import Path
          import random
          root=Path('assets/real-demo-shots')
          def face(size,bold=False):
              paths=[
                '/usr/share/fonts/truetype/comfortaa/Comfortaa-Bold.ttf' if bold else '/usr/share/fonts/truetype/comfortaa/Comfortaa-Regular.ttf',
                '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf' if bold else '/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',
              ]
              for fn in paths:
                  try:return ImageFont.truetype(fn,size)
                  except OSError:pass
              return ImageFont.load_default()
          def logo_img(mode,size):
              original=Image.open('assets/va-dark.png' if mode=='dark' else 'assets/va-light.png').convert('RGBA')
              bbox=original.getchannel('A').getbbox()
              original=original.crop(bbox)
              original.thumbnail(size,Image.Resampling.LANCZOS)
              return original
          def rounded_card(original,sz,radius=17):
              orig=original.convert('RGB')
              w,h=sz
              # Crop UI deliberately without altering the content or values.
              ratio=w/h
              if orig.width/orig.height>ratio:
                  target=int(orig.height*ratio)
                  orig=orig.crop((orig.width-target,0,orig.width,orig.height))
              else:
                  target=int(orig.width/ratio)
                  orig=orig.crop((orig.width-target)//2,0,(orig.width+target)//2,target)
              orig=orig.resize(sz,Image.Resampling.LANCZOS)
              mask=Image.new('L',sz,0)
              ImageDraw.Draw(mask).rounded_rectangle((0,0,w-1,h-1),radius=radius,fill=255)
              return orig,mask
          def draw_header(mode,device):
              mobile=device=='mobile'
              W,H=(760,278) if mobile else (1280,300)
              bg=(12,13,19) if mode=='dark' else (249,248,250)
              fg=(242,239,244) if mode=='dark' else (24,23,28)
              secondary=(181,166,197) if mode=='dark' else (95,76,113)
              accent=(167,139,218) if mode=='dark' else (81,55,123)
              im=Image.new('RGB',(W,H),bg);d=ImageDraw.Draw(im)
              random.seed(381)
              for i in range(4500 if mobile else 7800):
                  x=random.randrange(W);y=random.randrange(H)
                  dc=random.choice([-4,-3,-2,-1,1,2,3,4])
                  d.point((x,y),fill=tuple(max(0,min(255,v+dc)) for v in bg))
              if mobile:
                  va=logo_img(mode,(100,90));im.paste(va,(53,39),va)
                  d.text((170,29),'asina',font=face(74,True),fill=fg)
                  d.line((55,128,701,128),fill=(59,52,65) if mode=='dark' else (212,203,220),width=1)
                  d.text((54,154),'Pavel Shilov',font=face(40,True),fill=fg)
                  d.text((55,224),'APPLIED AI  /  SOFTWARE ENGINEERING',font=face(17,False),fill=accent)
              else:
                  va=logo_img(mode,(100,83));im.paste(va,(49,57),va)
                  d.text((169,45),'asina',font=face(86,True),fill=fg)
                  d.text((58,177),'Pavel Shilov',font=face(36,True),fill=fg)
                  d.text((61,239),'APPLIED AI  /  BACKEND  /  AUTOMATION',font=face(18,False),fill=accent)
                  # Cropped screenshots of browser sandboxes: not fabricated UI or results.
                  a=Image.open(root/'shp-desktop.png')
                  b=Image.open(root/'mgd-desktop.png')
                  for pic,loc,sz in [(a,(700,52),(272,185)),(b,(915,80),(293,175))]:
                      panel,mask=rounded_card(pic,sz,14)
                      im.paste(panel,loc,mask)
                      d.rounded_rectangle((loc[0],loc[1],loc[0]+sz[0]-1,loc[1]+sz[1]-1),radius=14,outline=(93,81,104) if mode=='dark' else (191,175,204),width=2)
              path=root/('hero-'+mode+'-'+device+'.png')
              im.save(path,optimize=True)
              print('Banner composed from official VA and cropped real demo screenshots:',path)
          for mode in ('dark','light'):
              for device in ('desktop','mobile'):draw_header(mode,device)
          PY
          python3 /tmp/readme-capture/header.py
      - name: Commit captures only if all 10 real screenshots are available
        run: |
          test "$(find assets/real-demo-shots -maxdepth 1 -name '*.png' | wc -l)" -eq 14
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/real-demo-shots
          git commit -m '[screenshots] Capture real portfolio demo UIs for README'
          git push origin HEAD:design/asina-profile-readme
